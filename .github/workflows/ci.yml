name: Validate native builds

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinentry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-validation:
    name: Windows and Linux x64/ARM64
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ github.sha }}
      upload_assets: false
